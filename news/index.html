<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="theme-color" id="tcolor" content="#0B2E4A">
<title>교회소식</title>

<!-- 홈 화면에 추가했을 때 — 이름은 「웹소식지」, 아이콘은 교회 사진 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="웹소식지">
<meta name="application-name" content="웹소식지">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 그 주의 내용과 「우리 교회 설정」(색·글씨체·로고)이 담긴 파일 -->
<script src="content.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   우리 교회 설정 적용 — content.js 의 church / theme 값을 읽어
   색·글씨체·교회 이름을 이 소식지에 입힙니다.
   설정이 없으면 기본값(남색 · IBM Plex Sans KR)이 쓰입니다.
   ※ 이 파일은 손대지 마시고 「소식지 만들기」 화면에서 고치십시오.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  var FONTS = {
    plex:     { css:"IBM+Plex+Sans+KR:wght@500;700",
                stack:'"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif' },
    noto:     { css:"Noto+Sans+KR:wght@500;700",
                stack:'"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif' },
    gothica1: { css:"Gothic+A1:wght@500;700",
                stack:'"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif' },
    nanum:    { css:"Nanum+Gothic:wght@400;700",
                stack:'"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif' },
    myeongjo: { css:"Nanum+Myeongjo:wght@400;700",
                stack:'"Nanum Myeongjo","AppleMyungjo","Batang",serif' },
    gowun:    { css:"Gowun+Batang:wght@400;700",
                stack:'"Gowun Batang","AppleMyungjo","Batang",serif' }
  };

  var T = {}, K = {};
  try { T = (CONTENT && CONTENT.theme)  || {}; } catch (e) {}
  try { K = (CONTENT && CONTENT.church) || {}; } catch (e) {}

  function hex(v, dflt) {
    v = String(v == null ? "" : v).trim();
    return /^#[0-9a-fA-F]{6}$/.test(v) ? v : dflt;
  }
  var main  = hex(T.main,  "#1D4E73");   /* 대표색 — 제목·글자 */
  var point = hex(T.point, "#3FA9DC");   /* 강조색 — 작은 라벨·밑줄 */
  var deep  = hex(T.deep,  "#0B2E4A");   /* 표지 어두운 색 */

  function rgb(h) {
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  function tint(h, ratio) {              /* 흰색과 섞어 아주 연한 배경색을 만든다 */
    var c = rgb(h), o = "#";
    for (var i = 0; i < 3; i++) {
      var v = Math.round(c[i] * ratio + 255 * (1 - ratio));
      o += ("0" + v.toString(16)).slice(-2);
    }
    return o;
  }
  function rgba(h, a) { var c = rgb(h); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  var S = document.documentElement.style;
  S.setProperty("--color-navy",     main);
  S.setProperty("--color-sky",      point);
  S.setProperty("--color-deep",     deep);
  S.setProperty("--color-navy-050", tint(main,  0.075));
  S.setProperty("--color-sky-050",  tint(point, 0.085));
  S.setProperty("--border-soft",    rgba(main, 0.16));
  S.setProperty("--border-faint",   rgba(main, 0.10));
  S.setProperty("--overlay-deep",   rgba(deep, 0.96));
  S.setProperty("--gradient-spirit",  "linear-gradient(180deg," + point + " 0%," + deep + " 100%)");
  S.setProperty("--gradient-protect", "linear-gradient(180deg," + rgba(deep,0) + " 0%," + rgba(deep,0.78) + " 100%)");
  S.setProperty("--shadow-card", "0 1px 2px " + rgba(deep,0.06) + ",0 6px 18px " + rgba(deep,0.08));
  S.setProperty("--shadow-nav",  "0 -1px 0 var(--border-hairline),0 -8px 24px " + rgba(deep,0.06));

  /* 성도님이 고르신 글자 크기 — 첫 그림 전에 넣어야 깜빡이지 않습니다 */
  try {
    var FSV = { s:0.9, m:1, l:1.2, xl:1.45 };
    var fk = localStorage.getItem("church-fs");
    if (FSV[fk]) S.setProperty("--fs-scale", String(FSV[fk]));
  } catch (e) {}

  var tc = document.getElementById("tcolor");
  if (tc) tc.setAttribute("content", deep);

  /* 글씨체 — 화면 표시를 막지 않는 방식으로 불러옵니다.
     인터넷이 느리거나 구글 폰트가 막혀도 소식지는 즉시 뜹니다. */
  var f = FONTS[T.font] || FONTS.plex;
  S.setProperty("--font-sans",  f.stack);
  S.setProperty("--font-serif", f.stack);
  var url = "https://fonts.googleapis.com/css2?family=" + f.css + "&display=swap";
  var pre = document.createElement("link");
  pre.rel = "preload"; pre.as = "style"; pre.href = url;
  document.head.appendChild(pre);
  var css = document.createElement("link");
  css.rel = "stylesheet"; css.media = "print"; css.href = url;
  css.onload = function () { css.media = "all"; };
  document.head.appendChild(css);

  if (K.name) document.title = String(K.name) + " 교회소식";
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   교회 소식지 디자인 기준값
   색·글씨체는 content.js 의 theme 값으로 자동으로 덮어써집니다.
   (이 파일은 손대지 마십시오. 내용은 「소식지 만들기」에서 고칩니다)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --color-navy:#1D4E73; --color-sky:#3FA9DC; --color-deep:#0B2E4A;
  --color-white:#FFFFFF; --color-slate:#38424C; --color-gray-dark:#8C8C8C;
  --color-gray-light:#E5E5E5;
  --color-sky-050:#EEF7FC; --color-navy-050:#EEF2F6;

  --surface-page:var(--color-white);
  --surface-muted:var(--color-navy-050);
  --surface-tint:var(--color-sky-050);
  --surface-dark:var(--color-deep);

  --text-strong:var(--color-navy);
  --text-body:var(--color-slate);
  --text-muted:var(--color-gray-dark);
  --text-on-dark:var(--color-white);
  --text-on-dark-muted:rgba(255,255,255,.72);

  --border-hairline:var(--color-gray-light);
  --border-soft:rgba(29,78,115,.16);
  --border-faint:rgba(29,78,115,.10);
  --border-on-dark:rgba(255,255,255,.22);
  --overlay-deep:rgba(11,46,74,.96);

  --gradient-spirit:linear-gradient(180deg,var(--color-sky) 0%,var(--color-deep) 100%);
  --gradient-protect:linear-gradient(180deg,rgba(11,46,74,0) 0%,rgba(11,46,74,.78) 100%);

  --font-serif:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;

  --fs-scale:1;
  --fs-display:calc(40px * var(--fs-scale)); --fs-heading:calc(22px * var(--fs-scale));
  --fs-label:calc(22px * var(--fs-scale)); --fs-body:calc(16px * var(--fs-scale)); --fs-meta:calc(16px * var(--fs-scale)); --fs-caption:calc(16px * var(--fs-scale));

  --lh-tight:1.15; --lh-title:1.3; --lh-body:1.8; --lh-verse:1.65;
  --tracking-tight:-.02em; --tracking-label:.12em; --tracking-logo:.285em;

  --page-gutter:20px;
  --radius-xs:2px; --radius-sm:4px; --radius-md:8px; --radius-lg:14px;

  --shadow-card:0 1px 2px rgba(11,46,74,.06),0 6px 18px rgba(11,46,74,.08);
  --shadow-nav:0 -1px 0 var(--border-hairline),0 -8px 24px rgba(11,46,74,.06);
  --shadow-inset-hairline:inset 0 0 0 1px var(--border-hairline);

  --ease-standard:cubic-bezier(.22,.61,.36,1);
  --dur-fast:120ms; --dur-slow:420ms;
}
@media (prefers-reduced-motion:reduce){
  :root{--dur-fast:0ms; --dur-slow:0ms}
  *{animation-duration:0ms!important; transition-duration:0ms!important}
}

/* ── 기본 ────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--surface-muted); color:var(--text-body);
  font-family:var(--font-sans); font-size:var(--fs-body); font-weight:500;
  line-height:var(--lh-body); -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  /* 글자를 아주 크게 쓰시는 분 화면에서 옆으로 밀려나지 않도록 —
     다른 방법이 없을 때만 낱말 안에서 줄을 바꿉니다 (평소에는 영향이 없습니다) */
  overflow-wrap:anywhere;
}
h1,h2,h3,h4{font-family:var(--font-serif); color:var(--text-strong); line-height:var(--lh-title); margin:0}
p{margin:0; text-wrap:pretty}
button{font:inherit}
::-webkit-scrollbar{height:0; width:0}
@keyframes lwmIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ── 페이지 틀 ───────────────────────────────────────────────── */
.page{
  max-width:420px; margin:0 auto; min-height:100vh;
  background:var(--surface-page); box-shadow:var(--shadow-card);
  display:flex; flex-direction:column;
}
.page__body{
  flex:1; padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));
  animation:lwmIn var(--dur-slow) var(--ease-standard);
}
.sections{padding:32px var(--page-gutter) 0; display:flex; flex-direction:column; gap:40px}
section{display:flex; flex-direction:column; gap:16px; scroll-margin-top:calc(var(--tabh,0px) + 8px)}

/* ── 표지 ────────────────────────────────────────────────────── */
.cover{
  position:relative; overflow:hidden; isolation:isolate;
  background:var(--surface-dark); color:var(--text-on-dark);
  padding:32px var(--page-gutter) 40px;
  display:flex; flex-direction:column; gap:24px;
}
.cover__photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2; opacity:.38}
.cover__scrim{position:absolute; inset:0; z-index:-1; background:var(--gradient-protect)}
.cover--light{background:var(--color-white); color:var(--text-strong)}
.cover--light .cover__photo{opacity:.9}
.cover--light .cover__scrim{background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.94) 62%)}
.cover--light .cover__title{color:var(--text-strong)}
.cover--light .cover__verse{color:var(--text-body)}
.cover--light .cover__strip{border-top-color:var(--border-hairline); color:var(--text-body)}
.cover--light .cover__rule{background:var(--border-hairline)}
.cover--light .logo__ko,.cover--light .logo__en{color:var(--color-navy)}

.cover__titleblock{display:flex; flex-direction:column; gap:12px}
.eyebrow{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700;
  letter-spacing:var(--tracking-label); text-transform:uppercase; color:var(--color-sky);
}
.cover__title{
  font-family:var(--font-serif); font-weight:700; font-size:var(--fs-display);
  line-height:var(--lh-tight); letter-spacing:var(--tracking-tight);
  word-break:keep-all; white-space:pre-line; color:var(--text-on-dark);
}
.cover__verse{
  font-family:var(--font-serif); font-size:var(--fs-body); line-height:var(--lh-verse);
  color:var(--text-on-dark-muted); max-width:30ch; word-break:keep-all;
}
.cover__strip{
  display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap;
  border-top:1px solid var(--border-on-dark); padding-top:16px;
  font-family:var(--font-sans); font-weight:500; font-size:var(--fs-meta);
  color:var(--text-on-dark-muted);
}
.cover__strip span:first-child,.cover__strip span:last-child{word-break:keep-all}
.cover__rule{flex:1 1 12px; min-width:0; height:1px; background:var(--border-on-dark)}

/* ── 로고 ────────────────────────────────────────────────────── */
.logo{display:flex; flex-direction:row; align-items:center; gap:12px}
.logo__img{object-fit:contain; display:block}
.logo__text{display:flex; flex-direction:column; align-items:flex-start; gap:3px}
.logo__en{
  font-family:var(--font-serif); font-weight:700; color:var(--color-white);
  font-size:calc(9px * var(--fs-scale)); letter-spacing:var(--tracking-logo); line-height:1;
  text-transform:uppercase; padding-left:var(--tracking-logo);
}
.logo__ko{
  font-family:var(--font-serif); font-weight:700; color:var(--color-white);
  letter-spacing:-.01em; line-height:1.1;
  transform:scaleX(.95); transform-origin:left;
}

/* ── 목회자 3칸 ──────────────────────────────────────────────── */
.staff{display:flex; border-top:1px solid var(--border-hairline); background:var(--surface-muted)}
.staff__cell{min-width:0; word-break:keep-all}
.staff__cell{
  flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:4px;
  align-items:center; border-left:1px solid var(--border-faint);
}
.staff__role{
  font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:500;
  letter-spacing:.06em; word-break:keep-all; color:var(--text-muted);
}
.staff__name{font-family:var(--font-serif); font-size:calc(16px * var(--fs-scale)); font-weight:500; color:var(--text-strong)}

/* ── 섹션 머리 ───────────────────────────────────────────────── */
.sh{display:flex; flex-direction:column; gap:12px}
.sh__rule{width:40px; height:3px; background:var(--color-navy)}
.sh__row{display:flex; align-items:baseline; justify-content:space-between; gap:8px 16px; flex-wrap:wrap}
.sh__title{
  font-family:var(--font-serif); font-size:var(--fs-heading); font-weight:500;
  color:var(--text-strong); line-height:var(--lh-title);
  word-break:keep-all; min-width:0;
}
.sh__meta{
  font-family:var(--font-sans); font-weight:500; font-size:var(--fs-caption);
  color:var(--text-muted); white-space:normal; word-break:keep-all; min-width:0;
}

/* ── 카드 / 정보 줄 ──────────────────────────────────────────── */
.card-hairline{border-radius:var(--radius-md); box-shadow:var(--shadow-inset-hairline)}
.inforows{padding:18px 18px 6px; display:flex; flex-direction:column}
.inforow{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:16px 0; border-bottom:1px solid var(--border-hairline);
}
.inforow:last-child{border-bottom:none}
.inforow__col{display:flex; flex-direction:column; gap:3px; min-width:0}
.inforow__value{
  font-family:var(--font-sans); font-size:var(--fs-body); font-weight:700;
  color:var(--text-body); word-break:keep-all;
}
.inforow__note{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500;
  color:var(--text-muted); line-height:1.6; word-break:keep-all; white-space:pre-line;
}

/* ── 성구 카드 ───────────────────────────────────────────────── */
.verse{margin:0; display:flex; flex-direction:column; gap:16px; align-items:flex-start; text-align:left}
.verse__rule{width:28px; height:2px; background:var(--color-navy)}
/* 세 주 본문(.tintbox__text)과 같은 크기 — 굵기로만 앞머리임을 나타낸다 */
.verse__quote{
  margin:0; font-family:var(--font-serif); font-size:calc(22px * var(--fs-scale)); font-weight:500;
  line-height:var(--lh-verse); color:var(--text-strong); text-wrap:pretty; word-break:keep-all;
  white-space:pre-line;
}
.verse__ref{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700;
  letter-spacing:var(--tracking-label); color:var(--color-sky);
}

/* ── 탭 ──────────────────────────────────────────────────────── */
.tabs{display:flex; gap:6px}
.tab{
  flex:1; min-height:44px; cursor:pointer; border-radius:var(--radius-sm);
  border:1px solid var(--border-hairline); background:transparent;
  color:var(--text-muted); font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:500;
  transition:background var(--dur-fast) var(--ease-standard);
}
.tab[aria-selected="true"]{
  border-color:var(--color-navy); background:var(--color-navy);
  color:#fff; font-weight:700;
}

/* ── 성구 본문 박스 ──────────────────────────────────────────── */
.tintbox{
  background:var(--surface-tint); border-radius:var(--radius-md); padding:22px 20px;
  display:flex; flex-direction:column; gap:12px;
}
.tintbox__label{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700;
  letter-spacing:var(--tracking-label); color:var(--color-sky);
}
.tintbox__text{
  margin:0; font-family:var(--font-serif); font-size:calc(22px * var(--fs-scale)); line-height:1.85;
  color:var(--text-strong); word-break:keep-all; text-wrap:pretty; white-space:pre-line;
}

/* ── 푯대 말씀 ───────────────────────────────────────────────── */
.aim{
  position:relative; overflow:hidden; border-radius:var(--radius-lg);
  background:var(--surface-dark); padding:30px 24px;
  display:flex; flex-direction:column; gap:16px;
}
.runner{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gradient-spirit)}
.aim__title{
  margin:0; font-family:var(--font-serif); font-size:calc(26px * var(--fs-scale)); font-weight:700;
  line-height:1.35; color:var(--text-on-dark); word-break:keep-all; white-space:pre-line;
}
.aim__body{
  margin:0; font-family:var(--font-serif); font-size:calc(16px * var(--fs-scale)); line-height:1.9;
  color:var(--text-on-dark-muted); word-break:keep-all; white-space:pre-line;
}
.aim__ref{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700;
  letter-spacing:var(--tracking-label); color:var(--color-sky);
}

/* ── 정기모임 ────────────────────────────────────────────────── */
.meetingrow{
  display:grid; grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto);
  align-items:center; gap:10px 16px;
  padding:16px; background:transparent; border-radius:0;
  border-bottom:1px solid var(--border-hairline);
}
.meetingrow--hl{background:var(--surface-tint); border-radius:var(--radius-sm)}
.meetingrow__when{display:flex; flex-direction:column; gap:2px}
.meetingrow__day{font-family:var(--font-serif); font-size:var(--fs-label); font-weight:700; color:var(--text-strong); line-height:1.1}
.meetingrow__time{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; color:var(--text-muted)}
.meetingrow__name{font-family:var(--font-sans); font-size:var(--fs-body); font-weight:700; color:var(--text-body); word-break:keep-all}
.meetingrow__place{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; color:var(--text-muted); word-break:keep-all}
.pill{
  align-self:center; margin-top:4px; border:1px solid var(--border-soft);
  background:transparent; border-radius:999px; padding:9px 18px;
  font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700;
  color:var(--text-strong); cursor:pointer; min-height:44px;
  transition:background var(--dur-fast) var(--ease-standard);
}
.pill:hover{background:var(--surface-muted)}

/* ── 봉사 명단 ───────────────────────────────────────────────── */
.roster{display:flex; flex-direction:column; padding:6px 18px}
.roster__row{min-width:0;
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  padding:13px 0; border-bottom:1px solid var(--border-hairline);
}
.roster__row:last-child{border-bottom:none}
.roster__label{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:500; color:var(--text-muted); word-break:keep-all}
.roster__value{font-family:var(--font-sans); font-size:var(--fs-body); font-weight:700; color:var(--text-body); text-align:right; word-break:keep-all}
.quote{margin:0; font-family:var(--font-serif); font-size:calc(16px * var(--fs-scale)); line-height:1.8; color:var(--text-strong); word-break:keep-all; white-space:pre-line}
.quote__ref{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700; letter-spacing:.08em; color:var(--color-sky)}
.footnote{margin:0; font-family:var(--font-sans); font-size:var(--fs-caption); line-height:1.8; color:var(--text-muted); word-break:keep-all; white-space:pre-line}

/* ── 집회 포스터 ─────────────────────────────────────────────── */
.poster{
  position:relative; overflow:hidden; border-radius:var(--radius-lg);
  background:var(--surface-dark); color:var(--text-on-dark);
  padding:32px 24px; display:flex; flex-direction:column; gap:20px;
}
.poster__photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.3}
.poster__inner{position:relative; display:flex; flex-direction:column; gap:20px}
.badge{
  align-self:flex-start; font-family:var(--font-sans); font-size:var(--fs-caption);
  font-weight:700; letter-spacing:var(--tracking-label); text-transform:uppercase;
  color:var(--color-white); background:var(--color-sky);
  padding:5px 10px; border-radius:var(--radius-xs);
}
.poster__titleblock{display:flex; flex-direction:column; gap:8px}
.poster__title{
  font-family:var(--font-serif); font-size:var(--fs-display); font-weight:700;
  line-height:var(--lh-tight); letter-spacing:var(--tracking-tight);
  color:var(--text-on-dark); word-break:keep-all;
}
/* 설명 — 일시·장소·강사 아래에 오므로 가로줄로 구분한다 */
.poster__sub{
  font-family:var(--font-serif); font-size:var(--fs-body); line-height:var(--lh-verse);
  color:var(--text-on-dark-muted); word-break:keep-all; white-space:pre-line;
  padding-top:16px; border-top:1px solid var(--border-on-dark);
}
.poster__dl{
  margin:0; display:grid; grid-template-columns:minmax(48px,auto) minmax(0,1fr);
  row-gap:12px; column-gap:16px; font-family:var(--font-sans); font-size:var(--fs-body);
}
.poster__dl dt{color:var(--color-sky); font-weight:700; font-size:var(--fs-caption); letter-spacing:var(--tracking-label)}
.poster__dl dd{margin:0; color:var(--text-on-dark); font-weight:500; word-break:keep-all}

/* ── 수양회 ──────────────────────────────────────────────────── */
.retreat{display:flex; flex-direction:column; gap:12px; padding:20px 18px}
.retreat__title{margin:0; font-family:var(--font-serif); font-size:calc(22px * var(--fs-scale)); font-weight:500; color:var(--text-strong)}
.retreat__item{display:flex; flex-direction:column; gap:5px; padding:12px 0; border-top:1px solid var(--border-hairline)}
.retreat__head{display:flex; align-items:baseline; gap:4px 10px; flex-wrap:wrap}
.retreat__round{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700;
  color:var(--color-white); background:var(--color-navy);
  border-radius:var(--radius-xs); padding:3px 8px;
}
.retreat__when{font-family:var(--font-sans); font-size:var(--fs-body); font-weight:700; color:var(--text-body)}
.retreat__lang,.retreat__deadline{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; color:var(--text-muted); word-break:keep-all; white-space:pre-line}
.retreat__lang{line-height:1.7}
.secintro{margin:0; font-family:var(--font-sans); font-size:var(--fs-body); line-height:var(--lh-body); color:var(--text-body); word-break:keep-all; white-space:pre-line}

/* ── 사진 프레임 ─────────────────────────────────────────────── */
.frame{margin:0; display:flex; flex-direction:column; gap:8px}
.frame__box{
  position:relative; aspect-ratio:16/9; overflow:hidden;
  border-radius:var(--radius-md); background:var(--surface-muted);
}
.frame__box img{width:100%; height:100%; object-fit:cover; display:block}
.frame__ph{
  position:absolute; inset:0; display:grid; place-items:center;
  color:var(--text-muted); font-family:var(--font-sans); font-size:var(--fs-caption);
}
.frame__overlay{
  position:absolute; inset:0; display:flex; align-items:flex-end; padding:16px;
  background:var(--gradient-protect); color:var(--text-on-dark);
  font-family:var(--font-serif); font-size:var(--fs-label); font-weight:500;
}
.frame__caption{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; color:var(--text-muted)}

/* ── 교회단신 ────────────────────────────────────────────────── */
.newsitem{display:flex; flex-direction:column; gap:8px; padding:16px 0; border-bottom:1px solid var(--border-hairline)}
.newsitem:last-child{border-bottom:none}
.newsitem__meta{display:flex; align-items:center; gap:4px 12px; flex-wrap:wrap}
.newsitem__date{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700; color:var(--color-sky); letter-spacing:.04em}
.newsitem__cat{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; color:var(--text-muted)}
.newsitem__title{font-family:var(--font-serif); font-size:var(--fs-label); font-weight:500; color:var(--text-strong); line-height:var(--lh-title); word-break:keep-all}
.newsitem__body{font-family:var(--font-sans); font-size:var(--fs-body); line-height:var(--lh-body); color:var(--text-body); word-break:keep-all; white-space:pre-line}

/* ── 구역모임 ────────────────────────────────────────────────── */
.cells{display:flex; flex-direction:column; gap:10px}
.cell{display:flex; flex-direction:column; gap:8px; background:var(--surface-muted); border-radius:var(--radius-md); padding:16px 16px 6px}
.cell__when{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700; letter-spacing:.04em; color:var(--text-strong)}
.cell__row{display:grid; grid-template-columns:minmax(0,auto) minmax(0,1fr) minmax(0,auto); align-items:baseline; gap:6px 10px; padding:9px 0; border-top:1px solid var(--border-faint)}
.cell__zone{font-family:var(--font-serif); font-size:calc(16px * var(--fs-scale)); font-weight:700; color:var(--color-sky)}
.cell__place{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); line-height:1.6; color:var(--text-body); word-break:keep-all; white-space:pre-line}
.cell__who{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700; color:var(--text-muted); word-break:keep-all}

/* ── 달력 ────────────────────────────────────────────────────── */
.cal{padding:14px 12px}
.cal__names{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; margin-bottom:6px}
.cal__name{text-align:center; font-family:var(--font-sans); font-size:min(calc(16px * var(--fs-scale)), 5.4vw); font-weight:700; letter-spacing:.06em; color:var(--text-muted)}
.cal__grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px}
.cal__cell{
  min-height:46px; padding:6px 2px 5px; border:none; border-radius:var(--radius-sm);
  background:transparent; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:4px; cursor:pointer;
  transition:background var(--dur-fast) var(--ease-standard);
}
.cal__cell--empty{cursor:default}
.cal__cell[aria-pressed="true"]{background:var(--color-navy)}
.cal__num{font-family:var(--font-sans); font-size:min(calc(16px * var(--fs-scale)), 5.4vw); font-weight:500; color:var(--text-muted)}
.cal__cell--has .cal__num{font-weight:700; color:var(--text-strong)}
.cal__cell[aria-pressed="true"] .cal__num{color:#fff}
.cal__dot{width:0; height:0; border-radius:999px; background:var(--color-sky)}
.cal__cell--has .cal__dot{width:4px; height:4px}
.cal__picked{background:var(--surface-tint); border-radius:var(--radius-md); padding:18px; display:flex; flex-direction:column; gap:8px}
.cal__pickedLabel{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700; letter-spacing:var(--tracking-label); color:var(--color-sky)}
.cal__pickedItem{font-family:var(--font-sans); font-size:var(--fs-body); font-weight:500; line-height:1.7; color:var(--text-body); word-break:keep-all; white-space:pre-line}
.spans{display:flex; flex-direction:column}
.span__row{display:flex; align-items:baseline; gap:4px 12px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--border-hairline)}
.span__row:last-child{border-bottom:none}
.span__range{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700; letter-spacing:.04em; color:var(--color-sky); word-break:keep-all; min-width:0}
.span__label{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); line-height:1.7; color:var(--text-body); word-break:keep-all; white-space:pre-line}

/* ── 헌금 ────────────────────────────────────────────────────── */
.offering{border-radius:var(--radius-md); background:var(--surface-muted); padding:20px 18px; display:flex; flex-direction:column; gap:10px}
.offering__bank{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700; letter-spacing:var(--tracking-label); color:var(--color-sky)}
.offering__num{font-family:var(--font-serif); font-size:calc(22px * var(--fs-scale)); font-weight:700; color:var(--text-strong); letter-spacing:-.01em}
.offering__holder{font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:500; color:var(--text-body)}
.offering__btn{
  margin-top:6px; align-self:flex-start; min-height:44px; border:none;
  border-radius:var(--radius-sm); background:var(--color-navy); color:#fff;
  padding:0 18px; font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700;
  word-break:keep-all; cursor:pointer; transition:background var(--dur-fast) var(--ease-standard);
}
.offering__btn:hover{background:var(--color-deep)}
.offering__btn:active{transform:scale(.985)}

/* ── 광고 (긴급·이벤트 공지) ─────────────────────────────────── */
.notice{
  position:relative; overflow:hidden; border-radius:var(--radius-lg);
  background:var(--surface-tint); padding:22px 22px 22px 26px;
  display:flex; flex-direction:column; gap:10px;
}
.notice__badge{
  align-self:flex-start; font-family:var(--font-sans); font-size:var(--fs-caption);
  font-weight:700; letter-spacing:var(--tracking-label);
  color:var(--color-white); background:var(--color-navy);
  padding:4px 10px; border-radius:var(--radius-xs);
}
.notice__title{
  font-family:var(--font-serif); font-size:calc(22px * var(--fs-scale)); font-weight:700;
  color:var(--text-strong); line-height:var(--lh-title); word-break:keep-all;
}
.notice__body{
  font-family:var(--font-sans); font-size:var(--fs-body); line-height:var(--lh-body);
  color:var(--text-body); word-break:keep-all; white-space:pre-line;
}
.notice__meta{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:700;
  letter-spacing:.06em; color:var(--color-sky); word-break:keep-all;
}

/* ── 전국 교회 전도집회 ──────────────────────────────────────── */
.nat{display:flex; flex-direction:column; gap:12px}
.nat__grp{border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-inset-hairline)}
.nat__when{
  background:var(--surface-muted); padding:10px 14px; text-align:center;
  border-bottom:1px solid var(--border-hairline);
  font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700;
  color:var(--text-strong); letter-spacing:.02em;
}
.nat__list{display:flex; flex-wrap:wrap; gap:6px; padding:14px}
.nat__ch{
  font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); color:var(--text-body);
  background:var(--surface-tint); border-radius:999px; padding:5px 11px;
  white-space:nowrap;
}
.nat__count{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500;
  color:var(--text-muted); padding:0 14px 12px;
}

/* 교회 활동 사진과 사진 크게 보기는 「앨범」 페이지(album.html)로 옮겼습니다 */
.__moved_gal{display:none}
.gal{display:flex; flex-direction:column; gap:26px}
.gal__album{display:flex; flex-direction:column; gap:10px}
.gal__head{display:flex; align-items:baseline; justify-content:space-between; gap:4px 12px; flex-wrap:wrap}
.gal__title{
  font-family:var(--font-serif); font-size:var(--fs-label); font-weight:500;
  color:var(--text-strong); line-height:var(--lh-title); word-break:keep-all;
}
.gal__count{
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500;
  color:var(--text-muted); word-break:keep-all;
}
.gal__note{
  font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); line-height:1.8;
  color:var(--text-muted); word-break:keep-all; white-space:pre-line;
}
.gal__grid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
.gal__grid--one{grid-template-columns:1fr}
.gal__item{
  position:relative; aspect-ratio:1/1; overflow:hidden; display:block;
  border:none; padding:0; margin:0; border-radius:var(--radius-md);
  background:var(--surface-muted); cursor:zoom-in;
}
.gal__grid--one .gal__item{aspect-ratio:4/3}
.gal__item img{width:100%; height:100%; object-fit:cover; display:block}

/* ── 사진 크게 보기 ──────────────────────────────────────────── */
.lb{
  position:fixed; inset:0; z-index:200; background:var(--overlay-deep);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:56px 12px calc(64px + env(safe-area-inset-bottom,0px));
}
.lb.on{display:flex}
.lb__img{max-width:100%; max-height:100%; object-fit:contain; display:block; border-radius:4px}
.lb__top{
  position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;
  color:var(--text-on-dark); font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale));
}
.lb__cap{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb__n{color:var(--text-on-dark-muted); font-weight:500; white-space:nowrap}
.lb__x{
  margin-left:auto; flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--border-on-dark); background:rgba(255,255,255,.08);
  color:#fff; font-size:calc(22px * var(--fs-scale)); line-height:1; cursor:pointer;
}
.lb__bottom{
  position:absolute; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
}
.lb__b{
  min-width:96px; min-height:44px; border-radius:999px;
  border:1px solid var(--border-on-dark); background:rgba(255,255,255,.08);
  color:#fff; font-family:var(--font-sans); font-size:calc(16px * var(--fs-scale)); font-weight:700; cursor:pointer;
}
.lb__b:disabled{opacity:.32; cursor:default}

/* ── 푸터 ────────────────────────────────────────────────────── */
.foot{
  margin-top:40px; background:var(--surface-dark); color:var(--text-on-dark);
  padding:34px var(--page-gutter) 30px; display:flex; flex-direction:column; gap:14px;
}
.foot__names{display:flex; flex-direction:column; gap:2px}
.foot__ko{font-family:var(--font-serif); font-size:calc(22px * var(--fs-scale)); font-weight:500; color:var(--text-on-dark)}
.foot__en{font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500; letter-spacing:var(--tracking-label); text-transform:uppercase; color:var(--color-sky)}
.foot__info{
  display:flex; flex-direction:column; gap:7px; padding-top:14px;
  border-top:1px solid var(--border-on-dark); font-family:var(--font-sans);
  font-size:calc(16px * var(--fs-scale)); font-weight:500; line-height:1.7; color:var(--text-on-dark-muted);
}

/* ── 하단 내비게이션 ─────────────────────────────────────────── */
.navwrap{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none; z-index:50}
.navwrap__inner{width:100%; max-width:420px; pointer-events:auto}
.nav{
  display:flex; align-items:stretch; gap:0; flex-wrap:wrap;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  backdrop-filter:saturate(140%) blur(14px);
  box-shadow:var(--shadow-nav);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav__btn{
  flex:1 1 auto; min-width:max-content; min-height:56px; border:none; cursor:pointer; background:transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  font-family:var(--font-sans); font-size:var(--fs-caption); font-weight:500;
  color:var(--text-muted); padding:0 4px;
  transition:color var(--dur-fast) var(--ease-standard);
}
.nav__btn[aria-current="true"]{font-weight:700; color:var(--color-navy)}
.nav__ind{width:18px; height:2px; background:transparent}
.nav__btn[aria-current="true"] .nav__ind{background:var(--color-sky)}

/* ── 맨 위 탭 (소식지 · 말씀 페이지 · 앨범) ──────────────────── */
/* 말씀 페이지 · 앨범에도 똑같은 모양으로 들어갑니다 */
.tabbar{
  position:sticky; top:0; z-index:60; flex-direction:column; align-items:center; gap:8px;
  background:rgba(255,255,255,.94); backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--border-hairline);
  /* 홈 화면 앱으로 열었을 때 시계·배터리 줄에 탭이 가리지 않도록 위를 비운다 */
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--page-gutter) 8px;
  display:flex; justify-content:center;
}
.pagetabs{
  display:flex; gap:3px; width:100%; max-width:360px;
  background:var(--surface-muted); padding:3px; border-radius:11px;
}
.pagetabs a,.pagetabs .fstoggle{
  flex:1 1 0; min-width:0; text-align:center; text-decoration:none;
  border:0; background:transparent; cursor:pointer;
  border-radius:8px; padding:8px 4px; line-height:1.25;
  /* 맨 위 줄은 「내용」이 아니라 「길잡이」이므로 글자 크기 배수를 따르지 않습니다.
     (휴대폰 자체의 글자 크기 설정은 여기에도 그대로 적용됩니다) */
  font-family:var(--font-sans); font-size:14px; font-weight:700;
  color:var(--text-muted); word-break:keep-all;
  transition:background var(--dur-fast) var(--ease-standard);
}
.pagetabs a:hover,.pagetabs .fstoggle:hover{color:var(--text-strong)}
.pagetabs a[aria-current="page"],.pagetabs .fstoggle[aria-expanded="true"]{
  background:var(--surface-page); color:var(--text-strong);
  box-shadow:0 1px 3px rgba(11,46,74,.16);
}

/* ── 오류 안내 (content.js 문법이 틀렸을 때) ─────────────────── */
.oops{
  max-width:420px; margin:0 auto; min-height:100vh; background:#fff;
  padding:48px 24px; display:flex; flex-direction:column; gap:16px; justify-content:center;
}
.oops h1{font-size:calc(22px * var(--fs-scale))}
.oops p{font-size:calc(16px * var(--fs-scale)); line-height:1.8; color:var(--text-body)}
.oops code{background:#EEF2F6; color:#1D4E73; padding:2px 6px; border-radius:4px; font-size:calc(16px * var(--fs-scale)); word-break:break-all}
.oops__box{background:#fff8ea; border:1px solid #e8d5a8; border-radius:8px; padding:14px 16px; font-size:calc(16px * var(--fs-scale)); line-height:1.75; color:#7a5a1a}

/* ── 글자 크기 고르기 ─────────────────────────────────────────
   맨 위 줄의 「글자크기」를 누르면 아래에 네 가지가 펼쳐집니다.
   평소에는 접혀 있어 맨 위 줄 높이가 전과 같습니다.
   성도님 휴대폰의 글자 크기 설정을 막지 않고, 그 위에 --fs-scale 이 곱해집니다.
   이 줄의 글자만 배수를 따르지 않습니다(맨 위 줄이 화면을 덮지 않도록). */
.fspanel{
  display:flex; flex-wrap:wrap; justify-content:center; gap:5px;
  width:100%; max-width:360px;
}
.fspanel[hidden]{display:none}
.fsbtn{
  flex:1 1 auto; font-family:var(--font-sans); font-size:14px; font-weight:700; line-height:1;
  min-height:38px; padding:0 14px; border-radius:999px; cursor:pointer;
  border:1px solid var(--border-soft); background:var(--surface-page);
  color:var(--text-muted); white-space:nowrap;
  transition:background var(--dur-fast) var(--ease-standard);
}
.fsbtn:hover{background:var(--surface-muted)}
.fsbtn[aria-pressed="true"]{background:var(--color-navy); border-color:var(--color-navy); color:#fff}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ── 작은 도우미들 ───────────────────────────────────────── */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }
  function has(v) { return v != null && String(v).trim() !== ""; }

  /* content.js 를 못 읽었을 때 친절하게 안내 */
  if (typeof CONTENT === "undefined") {
    document.getElementById("app").outerHTML =
      '<div class="oops">' +
      '<h1>소식지 내용을 읽지 못했습니다</h1>' +
      '<p><code>content.js</code> 파일에 문법 오류가 있거나 파일이 같은 폴더에 없습니다.</p>' +
      '<div class="oops__box"><b>가장 흔한 원인 두 가지</b><br>' +
      '① 줄 끝의 쉼표( , )가 빠졌습니다.<br>' +
      '② 따옴표( " )를 한쪽만 지웠습니다.<br><br>' +
      '가장 마지막에 고친 줄을 다시 확인해 보십시오. 직전에 잘 되던 파일로 되돌리면 바로 복구됩니다.</div>' +
      '<p>그래도 해결되지 않으면 <code>content.js</code> 파일을 그대로 보내 주십시오.</p>' +
      '</div>';
    return;
  }

  var C = CONTENT;

  /* ── 컴포넌트 ────────────────────────────────────────────── */

  /* 로고 — 그림 · 영문 · 한글 모두 content.js 의 church 에서 옵니다.
     비워 두면 그 부분만 나오지 않습니다. */
  function Logo(size, showEn) {
    var K = C.church || {};
    var root = el("div", "logo");
    var n = 0;

    if (K.logoShow !== false && has(K.logo)) {
      var img = el("img", "logo__img");
      img.src = K.logo;
      img.alt = (K.logoKo || K.name || "교회") + " 심볼";
      img.width = size; img.height = size;
      img.style.width = size + "px"; img.style.height = size + "px";
      img.onerror = function () { img.style.display = "none"; };
      add(root, img); n++;
    }

    var txt = el("div", "logo__text"), t = 0;
    if (showEn && has(K.logoEn)) { add(txt, el("span", "logo__en", K.logoEn)); t++; }
    if (has(K.logoKo)) {
      var ko = el("span", "logo__ko", K.logoKo);
      ko.style.fontSize = Math.max(12, Math.round(size * 0.38)) + "px";
      add(txt, ko); t++;
    }
    if (t) { add(root, txt); n++; }

    return n ? root : null;
  }

  function SectionHeader(eyebrow, title, meta) {
    var h = el("header", "sh");
    add(h, el("div", "sh__rule"));
    if (has(eyebrow)) add(h, el("span", "eyebrow", eyebrow));
    var row = el("div", "sh__row");
    add(row, el("h2", "sh__title", title));
    if (has(meta)) add(row, el("span", "sh__meta", meta));
    return add(h, row);
  }

  function InfoRow(label, value, note) {
    var row = el("div", "inforow");
    var col = el("div", "inforow__col");
    add(col, el("span", "eyebrow", label));
    add(col, el("span", "inforow__value", value));
    if (has(note)) add(col, el("span", "inforow__note", note));
    return add(row, col);
  }

  function PhotoFrame(src, overlay, caption) {
    var fig = el("figure", "frame");
    var box = el("div", "frame__box");
    if (has(src)) {
      var img = el("img");
      img.src = src; img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.onerror = function () {
        img.remove();
        add(box, el("div", "frame__ph", "사진"));
      };
      add(box, img);
    } else {
      add(box, el("div", "frame__ph", "사진"));
    }
    if (has(overlay)) add(box, el("div", "frame__overlay", overlay));
    add(fig, box);
    if (has(caption)) add(fig, el("figcaption", "frame__caption", caption));
    return fig;
  }

  /* ── 맨 위 탭 (소식지 · 말씀 페이지 · 앨범) ─────────────────
     소식지 · 말씀 페이지 · 앨범 세 파일이 똑같은 코드를 씁니다.
     내용이 없는 페이지는 탭에 나오지 않고, 남는 것이 하나면 탭 자체가 없습니다. */
  function tabList() {
    var out = [{ page: "index.html", label: "소식지" }];

    var s = C.sermons || {};
    var sOk = !!s.show && (s.playlists || []).some(function (p) {
      if (!p || p.show === false) return false;
      if (has(p.listId) || has(p.listUrl)) return true;
      var gs = (p.groups && p.groups.length) ? p.groups : [{ videos: p.videos || [] }];
      return gs.some(function (g) {
        if (!g || g.show === false) return false;
        if (has(g.listId) || has(g.listUrl)) return true;
        return (g.videos || []).some(function (v) { return v && (has(v.id) || has(v.url)); });
      });
    });
    if (sOk) out.push({ page: "sermon.html", label: s.navLabel || "말씀 페이지" });

    var g0 = C.gallery || {};
    var gOk = !!g0.show && (g0.albums || []).some(function (a) {
      return a && a.show !== false && (a.photos || []).filter(has).length > 0;
    });
    if (gOk) out.push({ page: "album.html", label: g0.navLabel || "앨범" });

    return out;
  }
  var TAB_H = 0;

  /* ── 글자 크기 (성도님 폰 설정 위에 곱해집니다) ──────────────
     폰 글자 설정을 막지 않습니다. 이미 크게 쓰시는 분은 손대실 것이 없고,
     더 키우거나 줄이고 싶은 분만 누르시면 됩니다. 고른 값은 그 기기에 남습니다. */
  var FS_KEY = "church-fs";
  var FS_STEPS = [
    { key: "s",  label: "작게",     v: 0.9  },
    { key: "m",  label: "보통",     v: 1    },
    { key: "l",  label: "크게",     v: 1.2  },
    { key: "xl", label: "아주 크게", v: 1.45 }
  ];
  function fsCurrent() {
    var k = "";
    try { k = localStorage.getItem(FS_KEY) || ""; } catch (e) {}
    for (var i = 0; i < FS_STEPS.length; i++) if (FS_STEPS[i].key === k) return FS_STEPS[i];
    return FS_STEPS[1];
  }
  function fsApply(step) {
    document.documentElement.style.setProperty("--fs-scale", String(step.v));
    try { localStorage.setItem(FS_KEY, step.key); } catch (e) {}
  }
  /* 「글자크기」를 눌렀을 때 펼쳐지는 줄 */
  function buildFontPanel() {
    var cur = fsCurrent();
    fsApply(cur);
    var box = el("div", "fspanel");
    box.hidden = true;
    FS_STEPS.forEach(function (s) {
      var b = el("button", "fsbtn", s.label);
      b.type = "button";
      b.setAttribute("aria-pressed", s.key === cur.key ? "true" : "false");
      b.onclick = function () {
        fsApply(s);
        Array.prototype.forEach.call(box.children, function (c, i) {
          c.setAttribute("aria-pressed", FS_STEPS[i].key === s.key ? "true" : "false");
        });
        measureTabs();
      };
      add(box, b);
    });
    return box;
  }

  /* 맨 위 줄 — 「글자크기 · 소식지 · 말씀 · 앨범」
     「글자크기」를 누르면 그 아래에 크기 고르는 줄이 펼쳐집니다.
     접혀 있을 때는 맨 위 줄 높이가 전과 같습니다. */
  function buildTabs(current) {
    var bar = el("div", "tabbar");
    var tabs = el("div", "pagetabs");
    var panel = buildFontPanel();

    var toggle = el("button", "fstoggle", "글자크기");
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "false");
    toggle.onclick = function () {
      var willOpen = panel.hidden;
      panel.hidden = !willOpen;
      toggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
      measureTabs();
    };
    add(tabs, toggle);

    /* 내용이 있는 페이지가 둘 이상일 때만 페이지 탭을 붙입니다 */
    var list = tabList();
    if (list.length >= 2) {
      list.forEach(function (it) {
        var a = el("a", null, it.label);
        a.href = it.page;
        if (it.page === current) a.setAttribute("aria-current", "page");
        add(tabs, a);
      });
    }
    return add(bar, tabs, panel);
  }
  function measureTabs() {
    var b = document.querySelector(".tabbar");
    TAB_H = b ? Math.round(b.getBoundingClientRect().height) : 0;
    document.documentElement.style.setProperty("--tabh", TAB_H + "px");
  }
  /* ── 1. 표지 ─────────────────────────────────────────────── */
  function buildCover() {
    var c = C.cover || {};
    var sec = el("section", "cover" + (c.theme === "light" ? " cover--light" : ""));
    sec.id = "hero";

    if (has(c.photo)) {
      var img = el("img", "cover__photo");
      img.src = c.photo; img.alt = "";
      img.onerror = function () { img.remove(); };
      add(sec, img);
      add(sec, el("div", "cover__scrim"));
    }

    add(sec, Logo(34, false));

    var tb = el("div", "cover__titleblock");
    var f = C.footer || {};
    if (has(f.en)) add(tb, el("span", "eyebrow", f.en));
    add(tb, el("h1", "cover__title", c.title || ""));
    add(sec, tb);

    if (has(c.verse)) add(sec, el("p", "cover__verse", c.verse));

    var strip = el("div", "cover__strip");
    add(strip, el("span", null, c.issue || ""));
    add(strip, el("span", "cover__rule"));
    add(strip, el("span", null, c.date || ""));
    add(sec, strip);

    var wrap = el("div");
    wrap.id = "hero-wrap";
    add(wrap, sec);

    var staff = el("div", "staff");
    (C.staff || []).forEach(function (s) {
      var cell = el("div", "staff__cell");
      add(cell, el("span", "staff__role", s.role));
      add(cell, el("span", "staff__name", s.name));
      add(staff, cell);
    });
    return add(wrap, staff);
  }

  /* ── 1.5 광고 (모든 성도에게 알릴 일이 있을 때) ──────────── */
  function buildNotice() {
    var n = C.notice || {};
    if (!n.show) return null;
    if (!has(n.title) && !has(n.body)) return null;
    var sec = el("section"); sec.id = "notice";
    var box = el("div", "notice");
    if (has(n.label)) add(box, el("span", "notice__badge", n.label));
    if (has(n.title)) add(box, el("h2", "notice__title", n.title));
    if (has(n.body)) add(box, el("p", "notice__body", n.body));
    if (has(n.meta)) add(box, el("span", "notice__meta", n.meta));
    return add(sec, box);
  }

  /* ── 2. 금일 말씀 ────────────────────────────────────────── */
  function buildToday() {
    var t = C.today || {};
    var sec = el("section"); sec.id = "today";
    add(sec, SectionHeader("Today", "금일 말씀 및 찬양"));
    var card = el("div", "card-hairline");
    var rows = el("div", "inforows");
    /* 내용이 비어 있는 줄은 내보내지 않는다 (외부 설교가 없는 주 등) */
    (t.rows || []).forEach(function (r) {
      if (!has(r.value) && !has(r.note)) return;
      add(rows, InfoRow(r.label, r.value, r.note));
    });
    return add(sec, add(card, rows));
  }

  /* ── 3. 성구암송 ─────────────────────────────────────────── */
  function buildMemory() {
    var m = C.memory || {};
    var verses = m.verses || [];
    var sec = el("section"); sec.id = "verse";
    add(sec, SectionHeader("Memory Verses", "성구암송", "개역한글"));

    /* 맨 위 큰 성구 — 적지 않으면 가로줄까지 통째로 나오지 않는다 */
    var mv = m.mainVerse || {};
    if (has(mv.text)) {
      var fig = el("figure", "verse");
      add(fig, el("div", "verse__rule"));
      add(fig, el("blockquote", "verse__quote", mv.text));
      if (has(mv.ref)) add(fig, el("figcaption", "verse__ref", mv.ref));
      add(sec, fig);
    }

    var tabs = el("div", "tabs");
    tabs.setAttribute("role", "tablist");
    var box = el("div", "tintbox");
    var label = el("span", "tintbox__label");
    var text = el("p", "tintbox__text");
    add(box, label, text);

    var current = Math.min(Math.max(m.openTab || 0, 0), Math.max(verses.length - 1, 0));
    function paint() {
      var v = verses[current] || {};
      var tp = has(v.topic) ? v.topic : (has(m.topic) ? m.topic : "");
      label.textContent = (has(tp) ? tp + " · " : "") + (v.ref || "");
      text.textContent = v.text || "";
      Array.prototype.forEach.call(tabs.children, function (b, i) {
        b.setAttribute("aria-selected", i === current ? "true" : "false");
      });
    }
    verses.forEach(function (v, i) {
      var b = el("button", "tab", v.label);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.onclick = function () { current = i; paint(); };
      add(tabs, b);
    });
    paint();
    return add(sec, tabs, box);
  }

  /* ── 4. 푯대 말씀 ────────────────────────────────────────── */
  function buildAim() {
    var a = C.aim || {};
    var sec = el("section"); sec.id = "goal";
    add(sec, SectionHeader("Our Aim", "푯대 말씀"));
    var box = el("div", "aim");
    add(box, el("div", "runner"));
    add(box, el("p", "aim__title", a.title || ""));
    add(box, el("p", "aim__body", a.body || ""));
    if (has(a.ref)) add(box, el("span", "aim__ref", a.ref));
    return add(sec, box);
  }

  /* ── 5. 정기모임 ─────────────────────────────────────────── */
  function buildMeetings() {
    var all = C.meetings || [];
    var sec = el("section"); sec.id = "meetings";
    add(sec, SectionHeader("Weekly Services", "정기모임"));

    var list = el("div");
    var open = false;
    var btn = el("button", "pill");
    btn.type = "button";

    function paint() {
      list.textContent = "";
      (open ? all : all.slice(0, 6)).forEach(function (m) {
        var row = el("div", "meetingrow" + (m.highlight ? " meetingrow--hl" : ""));
        var when = el("div", "meetingrow__when");
        add(when, el("span", "meetingrow__day", m.day || ""));
        add(when, el("span", "meetingrow__time", m.time || ""));
        add(row, when);
        add(row, el("span", "meetingrow__name", m.name || ""));
        if (has(m.place)) add(row, el("span", "meetingrow__place", m.place));
        add(list, row);
      });
      btn.textContent = open ? "접기" : "정기모임 전체 보기 (" + all.length + ")";
    }
    btn.onclick = function () { open = !open; paint(); };
    paint();
    add(sec, list);
    if (all.length > 6) add(sec, btn);
    return sec;
  }

  /* ── 6. 안내 및 봉사 ─────────────────────────────────────── */
  function buildServing() {
    var s = C.serving || {};
    var weeks = s.weeks || [];
    var sec = el("section"); sec.id = "serving";
    add(sec, SectionHeader("Guide & Serving", "안내 및 봉사"));

    var tabs = el("div", "tabs");
    tabs.setAttribute("role", "tablist");
    var card = el("div", "card-hairline");
    var rows = el("div", "roster");
    add(card, rows);

    var current = 0;
    function paint() {
      rows.textContent = "";
      ((weeks[current] || {}).rows || []).forEach(function (pair) {
        var r = el("div", "roster__row");
        add(r, el("span", "roster__label", pair[0]));
        add(r, el("span", "roster__value", pair[1]));
        add(rows, r);
      });
      Array.prototype.forEach.call(tabs.children, function (b, i) {
        b.setAttribute("aria-selected", i === current ? "true" : "false");
      });
    }
    weeks.forEach(function (w, i) {
      var b = el("button", "tab", w.label);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.onclick = function () { current = i; paint(); };
      add(tabs, b);
    });
    paint();
    add(sec, tabs, card);

    if (has(s.quote)) {
      var q = el("p", "quote", s.quote + " ");
      if (has(s.quoteRef)) add(q, el("span", "quote__ref", s.quoteRef));
      add(sec, q);
    }
    if (has(s.note)) add(sec, el("p", "footnote", s.note));
    return sec;
  }

  /* ── 포스터 카드 — 전도집회 · 전국 행사 · 해외 선교가 함께 씁니다 ─
     세 번째 줄의 이름표만 섹션마다 다릅니다 (강사 / 선교사). */
  function PosterCard(p, thirdLabel) {
    var box = el("section", "poster");
    if (has(p.photo)) {
      var img = el("img", "poster__photo");
      img.src = p.photo; img.alt = ""; img.loading = "lazy";
      img.onerror = function () { img.remove(); };
      add(box, img);
    }
    add(box, el("div", "runner"));
    var inner = el("div", "poster__inner");
    if (has(p.badge)) add(inner, el("span", "badge", p.badge));
    var tb = el("div", "poster__titleblock");
    add(tb, el("h2", "poster__title", p.title || ""));
    add(inner, tb);

    var dl = el("dl", "poster__dl");
    [["일시", p.when], ["장소", p.where], [thirdLabel || "강사", p.speaker]].forEach(function (pair) {
      if (!has(pair[1])) return;
      add(dl, el("dt", null, pair[0]));
      add(dl, el("dd", null, pair[1]));
    });
    add(inner, dl);
    /* 설명은 일시·장소 아래에 */
    if (has(p.subtitle)) add(inner, el("p", "poster__sub", p.subtitle));
    return add(box, inner);
  }

  /* 포스터를 쓰는 섹션(전국 행사 · 해외 선교)을 한 가지 방법으로 그린다.
     넣은 것이 하나도 없으면 제목까지 통째로 나오지 않는다. */
  function PosterSection(d, id, defEn, defTitle, thirdLabel) {
    d = d || {};
    if (d.show === false) return null;
    var posters = (d.posters || []).filter(function (p) {
      return p && (has(p.title) || has(p.when) || has(p.where) ||
                   has(p.speaker) || has(p.subtitle) || has(p.badge));
    });
    if (!posters.length && !has(d.intro) && !has(d.note)) return null;
    var sec = el("section"); sec.id = id;
    add(sec, SectionHeader(has(d.en) ? d.en : defEn, has(d.title) ? d.title : defTitle));
    if (has(d.intro)) add(sec, el("p", "secintro", d.intro));
    posters.forEach(function (p) { add(sec, PosterCard(p, thirdLabel)); });
    if (has(d.note)) add(sec, el("p", "footnote", d.note));
    return sec;
  }

  /* ── 7. 전도집회 ─────────────────────────────────────────── */
  function buildRevival() {
    var r = C.revival || {};
    var sec = el("section"); sec.id = "revival";
    add(sec, SectionHeader("Evangelistic Meeting", "전도집회 안내"));

    var rt = r.retreat || {};
    if (rt.show) {
      var card = el("div", "card-hairline retreat");
      if (has(rt.eyebrow)) add(card, el("span", "eyebrow", rt.eyebrow));
      add(card, el("h3", "retreat__title", rt.title || ""));
      (rt.rounds || []).forEach(function (x) {
        var item = el("div", "retreat__item");
        var head = el("div", "retreat__head");
        add(head, el("span", "retreat__round", x.round));
        add(head, el("span", "retreat__when", x.when));
        add(item, head);
        if (has(x.lang)) add(item, el("span", "retreat__lang", x.lang));
        if (has(x.deadline)) add(item, el("span", "retreat__deadline", x.deadline));
        add(card, item);
      });
      add(sec, card);
    }

    (r.posters || []).forEach(function (p) { add(sec, PosterCard(p)); });

    /* 전국 교회 전도집회 */
    var nw = r.nationwide || {};
    var groups = (nw.groups || []).filter(function (g) {
      return g && (has(g.when) || has(g.churches));
    });
    if (nw.show && groups.length) {
      add(sec, el("div", "sh__rule"));
      add(sec, el("h3", "retreat__title", nw.title || "전국 교회 전도집회"));
      var wrap = el("div", "nat");
      groups.forEach(function (g) {
        var box = el("div", "nat__grp");
        if (has(g.when)) add(box, el("div", "nat__when", g.when));
        var names = String(g.churches || "")
          .split(/[,\n·]/).map(function (x) { return x.trim(); }).filter(Boolean);
        var list = el("div", "nat__list");
        names.forEach(function (nm) { add(list, el("span", "nat__ch", nm)); });
        add(box, list);
        if (names.length) add(box, el("div", "nat__count", "모두 " + names.length + "개 교회"));
        add(wrap, box);
      });
      add(sec, wrap);
    }
    return sec;
  }

  /* ── 7-b. 전국 행사 ──────────────────────────────────────── */
  function buildEvents() {
    return PosterSection(C.events, "events", "National Events", "전국 행사", "강사");
  }

  /* ── 7-c. 해외 선교 ──────────────────────────────────────── */
  function buildOverseas() {
    return PosterSection(C.overseas, "overseas", "Overseas Mission", "해외 선교", "선교사");
  }

  /* ── 8. 교회단신 ─────────────────────────────────────────── */
  function buildNews() {
    var n = C.news || {};
    var sec = el("section"); sec.id = "news";
    add(sec, SectionHeader("Church News", "교회단신"));
    if (has(n.photo)) {
      add(sec, PhotoFrame(n.photo, n.photoOverlay, n.photoCaption));
    }

    var list = el("div");
    (n.items || []).forEach(function (it) {
      var art = el("article", "newsitem");
      var meta = el("div", "newsitem__meta");
      add(meta, el("span", "newsitem__date", it.date || ""));
      if (has(it.category)) add(meta, el("span", "newsitem__cat", it.category));
      add(art, meta);
      add(art, el("h3", "newsitem__title", it.title || ""));
      if (has(it.body)) add(art, el("p", "newsitem__body", it.body));
      add(list, art);
    });
    add(sec, list);

    var cells = el("div", "cells");
    var groups = (n.cellGroups || []).filter(function (g) { return g && g.show !== false; });
    groups.forEach(function (g) {
      var box = el("div", "cell");
      var head = [g.title || "모임", g.when].filter(has).join(" · ");
      add(box, el("span", "cell__when", head));
      (g.rows || []).forEach(function (c) {
        var row = el("div", "cell__row");
        add(row, el("span", "cell__zone", c.zone));
        add(row, el("span", "cell__place", c.place));
        add(row, el("span", "cell__who", c.who || ""));
        add(box, row);
      });
      add(cells, box);
    });
    if (groups.length) add(sec, cells);
    return sec;
  }

  /* ── 9. 월간계획 (달력 자동 생성) ────────────────────────── */
  function buildPlan() {
    var p = C.plan || {};
    var year = p.year || new Date().getFullYear();
    var month = p.month || (new Date().getMonth() + 1);
    var days = p.days || {};

    var sec = el("section"); sec.id = "plan";
    add(sec, SectionHeader("Monthly Plan", month + "월 월간계획", "날짜를 눌러 보세요"));

    var card = el("div", "card-hairline cal");
    var names = el("div", "cal__names");
    ["주일", "월", "화", "수", "목", "금", "토"].forEach(function (d) {
      add(names, el("span", "cal__name", d));
    });
    add(card, names);

    var grid = el("div", "cal__grid");
    add(card, grid);

    var picked = el("div", "cal__picked");
    var pickedLabel = el("span", "cal__pickedLabel");
    var pickedList = el("div");
    pickedList.style.display = "flex";
    pickedList.style.flexDirection = "column";
    pickedList.style.gap = "8px";
    add(picked, pickedLabel, pickedList);

    var first = new Date(year, month - 1, 1).getDay();   // 0 = 주일
    var last = new Date(year, month, 0).getDate();
    var current = days[p.openDay] ? p.openDay : (p.openDay || 1);

    function paintPicked() {
      pickedLabel.textContent = month + "월 " + current + "일";
      pickedList.textContent = "";
      var items = days[current] && days[current].length ? days[current] : ["예정된 모임이 없습니다."];
      items.forEach(function (t) {
        add(pickedList, el("span", "cal__pickedItem", "— " + t));
      });
      Array.prototype.forEach.call(grid.children, function (b) {
        var d = b.getAttribute("data-day");
        b.setAttribute("aria-pressed", d && Number(d) === current ? "true" : "false");
      });
    }

    for (var i = 0; i < first; i++) {
      add(grid, el("div", "cal__cell cal__cell--empty"));
    }
    for (var d = 1; d <= last; d++) {
      (function (day) {
        var hasItems = !!(days[day] && days[day].length);
        var b = el("button", "cal__cell" + (hasItems ? " cal__cell--has" : ""));
        b.type = "button";
        b.setAttribute("data-day", day);
        b.setAttribute("aria-label", month + "월 " + day + "일");
        add(b, el("span", "cal__num", String(day)));
        add(b, el("span", "cal__dot"));
        b.onclick = function () { current = day; paintPicked(); };
        add(grid, b);
      })(d);
    }
    var trailing = (7 - ((first + last) % 7)) % 7;
    for (var j = 0; j < trailing; j++) {
      add(grid, el("div", "cal__cell cal__cell--empty"));
    }
    paintPicked();

    /* 여러 날에 걸친 주요 일정을 달력보다 먼저 */
    if ((p.spans || []).length) {
      var spans = el("div", "spans");
      p.spans.forEach(function (sp) {
        var row = el("div", "span__row");
        add(row, el("span", "span__range", sp.range));
        add(row, el("span", "span__label", sp.label));
        add(spans, row);
      });
      add(sec, spans);
    }
    add(sec, card, picked);
    return sec;
  }

  /* ── 10. 헌금 ────────────────────────────────────────────── */
  function buildOffering() {
    var o = C.offering || {};
    if (!o.show) return null;
    var sec = el("section"); sec.id = "offering";
    add(sec, SectionHeader("Offering", "헌금 안내"));
    var box = el("div", "offering");
    if (has(o.bank)) add(box, el("span", "offering__bank", o.bank));
    add(box, el("span", "offering__num", o.number || ""));
    if (has(o.holder)) add(box, el("span", "offering__holder", o.holder));

    var btn = el("button", "offering__btn", "계좌번호 복사");
    btn.type = "button";
    btn.onclick = function () {
      var done = function () {
        btn.textContent = "복사되었습니다";
        setTimeout(function () { btn.textContent = "계좌번호 복사"; }, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(o.number || "").then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = o.number || "";
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        done();
      }
    };
    add(box, btn);
    return add(sec, box);
  }

  /* ── 11. 해외 후원교회 ───────────────────────────────────── */
  function buildMissions() {
    var m = C.missions || {};
    var sec = el("section"); sec.id = "missions";
    add(sec, SectionHeader("World Missions", "해외 후원교회"));
    if (has(m.photo)) {
      add(sec, PhotoFrame(m.photo, m.photoOverlay, m.photoCaption));
    }
    var list = el("div");
    (m.items || []).forEach(function (x) {
      add(list, InfoRow(x.country, x.city, x.person));
    });
    return add(sec, list);
  }

  /* 12. 교회 활동 사진과 사진 크게 보기는 「앨범」 페이지(album.html)로 옮겼습니다 */

  /* ── 13. 푸터 ────────────────────────────────────────────── */
  /* ── 보이는 순서 ────────────────────────────────────────── */
  var BUILD = {
    notice: buildNotice, today: buildToday, revival: buildRevival,
    events: buildEvents, news: buildNews, plan: buildPlan,
    meetings: buildMeetings, serving: buildServing, offering: buildOffering,
    overseas: buildOverseas, missions: buildMissions, verse: buildMemory, goal: buildAim
  };
  var ORDER_DEFAULT = ["notice", "today", "revival", "events", "news", "plan",
                       "meetings", "serving", "offering", "overseas", "missions",
                       "verse", "goal"];
  /* 아래쪽 이동 단추에 올릴 수 있는 섹션과 그 이름 */
  var NAV_LABEL = { revival: "집회", news: "단신",
                    plan: "계획", meetings: "모임", verse: "암송" };
  function ORDER() {
    var want = ((C.layout || {}).order) || [];
    var out = [], seen = {};
    want.forEach(function (k) {
      if (BUILD[k] && !seen[k]) { out.push(k); seen[k] = true; }
    });
    /* 그 파일에 없던 항목은 맨 뒤가 아니라 기본 순서에서 제 자리에 끼워 넣는다 */
    ORDER_DEFAULT.forEach(function (k, i) {
      if (seen[k]) return;
      var at = out.length;
      for (var j = i - 1; j >= 0; j--) {
        var pos = out.indexOf(ORDER_DEFAULT[j]);
        if (pos >= 0) { at = pos + 1; break; }
      }
      out.splice(at, 0, k); seen[k] = true;
    });
    return out;
  }

  function buildFooter() {
    var f = C.footer || {};
    var foot = el("footer", "foot");
    add(foot, Logo(30, true));
    var names = el("div", "foot__names");
    add(names, el("span", "foot__ko", f.church || ""));
    add(names, el("span", "foot__en", f.en || ""));
    add(foot, names);
    var info = el("div", "foot__info");
    (f.lines || []).forEach(function (t) { add(info, el("span", null, t)); });
    return add(foot, info);
  }

  /* ── 14. 하단 내비게이션 ─────────────────────────────────── */
  /* 아래쪽 이동 단추 — 섹션 순서를 그대로 따라간다 */
  var NAV = [{ id: "hero", label: "표지" }];
  var SPY = ["hero"];
  var SPY_MAP = { hero: "hero" };
  (function () {
    var anchor = "hero";
    ORDER().forEach(function (k) {
      if (NAV_LABEL[k]) {
        NAV.push({ id: k, label: NAV_LABEL[k] });
        anchor = k;
      }
      SPY.push(k);
      SPY_MAP[k] = anchor;
    });
  })();

  function buildNav() {
    var wrap = el("div", "navwrap");
    var inner = el("div", "navwrap__inner");
    var nav = el("nav", "nav");
    NAV.forEach(function (it) {
      var b = el("button", "nav__btn");
      b.type = "button";
      b.setAttribute("data-target", it.id);
      add(b, el("span", "nav__ind"));
      add(b, el("span", null, it.label));
      b.onclick = function () {
        var t = document.getElementById(it.id);
        if (t) {
          window.scrollTo({
            top: t.getBoundingClientRect().top + window.scrollY - (TAB_H + 12),
            behavior: "smooth"
          });
        }
      };
      add(nav, b);
    });
    add(wrap, add(inner, nav));

    var active = "";
    function spy() {
      var cur = SPY[0];
      for (var i = 0; i < SPY.length; i++) {
        var e = document.getElementById(SPY[i]);
        if (e && e.getBoundingClientRect().top <= TAB_H + 90) cur = SPY[i];
      }
      var next = SPY_MAP[cur] || "hero";
      if (next === active) return;
      active = next;
      Array.prototype.forEach.call(nav.children, function (b) {
        b.setAttribute("aria-current", b.getAttribute("data-target") === next ? "true" : "false");
      });
    }
    window.addEventListener("scroll", spy, { passive: true });
    setTimeout(spy, 0);
    return wrap;
  }

  /* ── 조립 ────────────────────────────────────────────────── */
  try {
    var page = el("div", "page");
    var body = el("div", "page__body");
    add(body, buildCover());

    var sections = el("div", "sections");
    /* layout.order 에 적힌 순서대로 — 없거나 빠진 것은 기본 순서로 채운다 */
    ORDER().forEach(function (k) { add(sections, BUILD[k]()); });
    add(body, sections);
    add(body, buildFooter());
    add(page, buildTabs("index.html"), body);

    var app = document.getElementById("app");
    app.textContent = "";
    add(app, page, buildNav());
    measureTabs();
    window.addEventListener("resize", measureTabs, { passive: true });
    var kn = (C.church || {}).name;
    document.title = (kn ? kn + " " : "") + "교회소식 — " + ((C.cover || {}).issue || "");
  } catch (err) {
    document.getElementById("app").outerHTML =
      '<div class="oops">' +
      '<h1>소식지를 그리는 중 문제가 생겼습니다</h1>' +
      '<p><code>content.js</code> 에서 항목 하나의 모양이 어긋난 것 같습니다.</p>' +
      '<div class="oops__box"><b>오류 내용</b><br><code>' +
      String(err && err.message ? err.message : err).replace(/</g, "&lt;") +
      '</code></div>' +
      '<p>가장 마지막에 고친 부분을 확인해 보십시오. 목록의 대괄호 <code>[ ]</code> 나 중괄호 <code>{ }</code> 짝이 맞는지 보시면 대개 찾아집니다.</p>' +
      '</div>';
  }
})();
</script>
</body>
</html>
